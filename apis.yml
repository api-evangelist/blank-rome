aid: blank-rome
name: Blank Rome LLP
description: >-
  Blank Rome LLP is an Am Law 100 U.S. law firm founded in 1946 and headquartered
  in Philadelphia, with approximately 600+ attorneys across roughly 14 U.S.
  offices plus an international presence (Shanghai). The firm provides
  comprehensive legal and government-advocacy services across commercial and
  corporate litigation, corporate / M&A and finance, restructuring and
  bankruptcy, government contracts, intellectual property, labor and employment,
  real estate, tax, white-collar defense, matrimonial and family law, and a
  nationally recognized maritime and international trade practice. Blank Rome
  Government Relations LLC, the firm's affiliated lobbying arm, operates from
  Washington, D.C. The firm publishes practice-area client alerts, the Mainbrace
  maritime newsletter, and industry insights through its website's
  News & Events and Publications sections. Blank Rome does not operate a public
  developer program, REST/GraphQL API, SDK ecosystem, or GitHub organization;
  this profile catalogs the firm's public-facing knowledge surface (practice
  pages, newsletters, alerts) rather than a developer platform.
