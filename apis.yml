apis:
  - aid: blank-rome:website
    name: Blank Rome Public Website
    description: >-
      The Blank Rome public website at blankrome.com is the firm's primary
      external knowledge surface, organizing attorney biographies, practice and
      industry pages, office locations, client alerts, publications (including
      the Mainbrace maritime newsletter), news and events, and recruiting
      content. The site is delivered via Vercel and does not expose a public
      API, OpenAPI specification, GraphQL endpoint, or developer portal. It is
      protected by bot-mitigation that rate-limits automated crawlers.
